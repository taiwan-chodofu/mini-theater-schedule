services:
  - type: cron
    name: mini-theater-schedule
    runtime: python
    schedule: "0 22 * * *"  # UTC 22:00 = JST 07:00
    buildCommand: pip install -r requirements.txt
    startCommand: python render_cron.py
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: taiwan-chodofu
      - key: GITHUB_REPO
        value: mini-theater-schedule
