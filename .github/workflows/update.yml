name: Update Schedule
on:
  schedule:
    - cron: "0 22 * * *"  # UTC 22:00 = JST 07:00
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run schedule update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: taiwan-chodofu
          GITHUB_REPO: mini-theater-schedule
        run: python render_cron_v2.py

      - name: Retry on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: taiwan-chodofu
          GITHUB_REPO: mini-theater-schedule
        run: |
          echo "First attempt failed, retrying in 60s..."
          sleep 60
          python render_cron_v2.py
